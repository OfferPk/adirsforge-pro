<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    ADIRSForge Pro (v1.0.0) Architecture &amp; Telemetry Pipeline
  </text>
  <text x="480" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    Air Data &amp; Inertial Reference System | ARINC 704 (IRS), ARINC 706 (ADS) &amp; ARINC 738 (ADIRS)
  </text>

  <!-- Block 1: Physical Sensors -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">INERTIAL &amp; AIR SENSORS</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• Ring Laser Gyros (RLG / FOG)</text>
    <text x="20" y="105" font-family="monospace" font-size="12" fill="#cbd5e1">• Triaxial Accelerometers</text>
    <text x="20" y="135" font-family="monospace" font-size="12" fill="#cbd5e1">• Heated Pitot Probes (Pt)</text>
    <text x="20" y="165" font-family="monospace" font-size="12" fill="#cbd5e1">• Dual Static Ports (Ps)</text>
    <text x="20" y="195" font-family="monospace" font-size="12" fill="#cbd5e1">• Total Air Temp Probes (TAT)</text>
    <text x="20" y="225" font-family="monospace" font-size="12" fill="#cbd5e1">• Angle-of-Attack (AoA) Vanes</text>
    <text x="20" y="255" font-family="monospace" font-size="12" fill="#cbd5e1">• Earth Rate Gyrocompassing</text>
    <text x="35" y="275" font-family="monospace" font-size="11" fill="#94a3b8">- Ω_E = 15.041°/hr Alignment</text>
    <text x="20" y="305" font-family="monospace" font-size="12" fill="#cbd5e1">• Schuler Tuning (84.4 min)</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#042f2e" stroke="#14b8a6"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#2dd4bf">FAA TSO-C4c / TSO-C106</text>
  </g>

  <!-- Block 2: ADIRU Processing Unit -->
  <g transform="translate(350, 110)" filter="url(#shadow)">
    <rect width="260" height="370" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">ADIRU COMPUTING CORE</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#e2e8f0">• Strapdown Attitude Integration</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- Quaternions / DCM Matrix</text>
    <text x="20" y="125" font-family="monospace" font-size="12" fill="#e2e8f0">• Baro-Inertial Altitude Filter</text>
    <text x="35" y="145" font-family="monospace" font-size="11" fill="#94a3b8">- 3rd-Order Complementary</text>
    <text x="20" y="175" font-family="monospace" font-size="12" fill="#e2e8f0">• Aerodynamic Mach Calculator</text>
    <text x="35" y="195" font-family="monospace" font-size="11" fill="#94a3b8">- Saint-Venant &amp; Wantzel</text>
    <text x="20" y="225" font-family="monospace" font-size="12" fill="#e2e8f0">• True Airspeed (TAS) Conversion</text>
    <text x="20" y="255" font-family="monospace" font-size="12" fill="#e2e8f0">• ARINC 429 Bus Transmitter</text>
    <text x="35" y="275" font-family="monospace" font-size="11" fill="#94a3b8">- BNR 14-bit Pitch/Roll (324/325)</text>
    <text x="35" y="295" font-family="monospace" font-size="11" fill="#94a3b8">- BNR 17-bit Baro Alt (203/204)</text>
    <rect x="20" y="325" width="220" height="30" rx="4" fill="#172554" stroke="#3b82f6"/>
    <text x="130" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#60a5fa">DO-178C DAL-A FLIGHT CORE</text>
  </g>

  <!-- Block 3: Cockpit Flight Control Consumers -->
  <g transform="translate(670, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a855f7">FLIGHT GUIDANCE CONSUMERS</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• Primary Flight Display (PFD)</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- Artificial Horizon Pitch/Roll</text>
    <text x="35" y="115" font-family="monospace" font-size="11" fill="#94a3b8">- Speed &amp; Altitude Tapes</text>
    <text x="20" y="145" font-family="monospace" font-size="12" fill="#cbd5e1">• Flight Control Computer (FCC)</text>
    <text x="35" y="165" font-family="monospace" font-size="11" fill="#94a3b8">- Fly-By-Wire Normal Law</text>
    <text x="35" y="185" font-family="monospace" font-size="11" fill="#94a3b8">- Pitch &amp; Roll Flight Envelope</text>
    <text x="20" y="215" font-family="monospace" font-size="12" fill="#cbd5e1">• Flight Management (FMC/FMS)</text>
    <text x="20" y="245" font-family="monospace" font-size="12" fill="#cbd5e1">• TCAS &amp; TAWS Ground Warning</text>
    <text x="20" y="275" font-family="monospace" font-size="12" fill="#cbd5e1">• Flight Data Recorder (FDR)</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#3b0764" stroke="#a855f7"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#d8b4fe">ARINC 429 HIGH-SPEED (100k)</text>
  </g>

  <!-- Connectors -->
  <line x1="290" y1="295" x2="350" y2="295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <line x1="610" y1="295" x2="670" y2="295" stroke="#06b6d4" stroke-width="2"/>
</svg>